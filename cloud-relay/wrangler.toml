# Free Cloudflare relay: laptop and phones both dial out here, so neither needs a public address.
name = "yourandroidagent"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
